plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.danboz5125.phrasebook'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.danboz5125.phrasebook'
        minSdk 30
        targetSdk 35
        // CI sets these from the release tag and run number, so every build
        // installs over the last one.
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: '0.0.0-dev'
    }

    // One fixed, committed key for sideloading, so updates install over each
    // other and keep favorites. Not a Play Store key.
    signingConfigs {
        sideload {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    // The web app is the UI: ship web/ as the APK's assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }

    // A sideloaded personal app: don't let release lint block a build.
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
